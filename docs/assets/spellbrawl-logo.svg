<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" role="img" aria-labelledby="title description">
  <title id="title">SpellBrawl</title>
  <desc id="description">The SpellBrawl game logo in ivory and flame orange.</desc>
  <style>
    .spell { fill: #2b153f; }
    @media (prefers-color-scheme: dark) { .spell { fill: #f5efff; } }
  </style>
  <defs>
    <linearGradient id="flame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd376"/>
      <stop offset="0.48" stop-color="#ff7758"/>
      <stop offset="1" stop-color="#ff4d36"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(18 18)">
    <path d="M43 100C15 82 18 54 43 25c-2 22 10 28 17 39 10-17 8-35 23-53 8 24 31 39 24 67-5 22-24 38-48 38-6 0-11-1-16-3 17-2 29-14 29-29 0-8-4-15-10-22-1 13-8 21-19 27z" fill="url(#flame)" filter="url(#glow)"/>
    <path d="M50 103c-10-10-8-23 5-37 0 10 7 14 10 21 5-8 7-16 11-22 8 15 4 36-13 41-5 2-9 1-13-3z" fill="#fff3c4"/>
  </g>
  <text class="spell" x="140" y="108" font-family="Cinzel, Georgia, serif" font-size="86" font-weight="700" letter-spacing="-4">SPELL</text>
  <text x="415" y="108" fill="url(#flame)" font-family="Cinzel, Georgia, serif" font-size="86" font-weight="700" letter-spacing="-4">BRAWL</text>
</svg>
