[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[context.deploy-preview.environment]
  # These public provider settings are stored as secrets by the existing env
  # sync, but also appear as defaults in source. Continue scanning API keys.
  SECRETS_SCAN_OMIT_KEYS = "LLM_DIRECTOR_PROVIDER,LLM_DIRECTOR_TIMEOUT_MS,ANTHROPIC_BASE_URL,ANTHROPIC_DIRECTOR_MODEL"

[dev]
  framework = "#custom"
  command = "vite"
  targetPort = 5173
  port = 8888

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/models/hand_landmarker.task"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/octet-stream"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
